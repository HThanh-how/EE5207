name: Build LaTeX PDF - Milestone 2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose
        run: |
          echo "Triggered on $GITHUB_REF@${GITHUB_SHA}"
          ls -la EE5207_Sun || true

      - name: Compile LaTeX (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          latexmk_shell_escape: true
          extra_system_packages: |
          pre_compile: |
            tlmgr update --self
            tlmgr install biblatex biber biblatex-ieee csquotes siunitx circuitikz lm pgfplots babel-english fontspec listings

      - name: Publish PDF to project root
        run: |
          cp main.pdf Milestone2_Report.pdf
          ls -la

      - name: Upload artifact (PDF)
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-report-pdf
          path: Milestone2_Report.pdf

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone2-report-logs
          path: |
            main.log
            main.aux
            main.toc
            main.lof
            main.lot

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: milestone2-report-pdf
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Automated Build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/Milestone2_Report.pdf
